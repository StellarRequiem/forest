---
# Forest Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: forest
  labels:
    name: forest

---
# ConfigMap for shared configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: forest-config
  namespace: forest
data:
  FOREST_PATH: "/app"
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

---
# Secret for database credentials
apiVersion: v1
kind: Secret
metadata:
  name: forest-secrets
  namespace: forest
type: Opaque
stringData:
  DATABASE_URL: "postgresql://forest:forest_password@postgres:5432/forest_audit"
  REDIS_URL: "redis://redis:6379"
  OLLAMA_HOST: "http://ollama:11434"
  DB_PASSWORD: "forest_password"

---
# PersistentVolume for audit logs
apiVersion: v1
kind: PersistentVolume
metadata:
  name: forest-audit-pv
  namespace: forest
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  hostPath:
    path: /data/forest-audit

---
# PersistentVolume for vault
apiVersion: v1
kind: PersistentVolume
metadata:
  name: forest-vault-pv
  namespace: forest
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  hostPath:
    path: /data/forest-vault

---
# PersistentVolumeClaim for audit
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forest-audit-pvc
  namespace: forest
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi

---
# PersistentVolumeClaim for vault
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forest-vault-pvc
  namespace: forest
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi

---
# Service for PostgreSQL
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: forest
spec:
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None

---
# Service for Redis
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: forest
spec:
  ports:
    - port: 6379
      targetPort: 6379
  clusterIP: None

---
# Service for Ollama
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: forest
spec:
  ports:
    - port: 11434
      targetPort: 11434
  clusterIP: None
