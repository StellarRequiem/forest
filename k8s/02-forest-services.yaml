---
# Forest Core - CUS Orchestration
# Deployment: 3 replicas, stateless
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forest-core
  namespace: forest
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: forest-core
  template:
    metadata:
      labels:
        app: forest-core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      containers:
      - name: forest-core
        image: forest-core:1.0.0-alpha
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: api
        envFrom:
        - configMapRef:
            name: forest-config
        - secretRef:
            name: forest-secrets
        volumeMounts:
        - name: forest-vault
          mountPath: /home/forest/.ForestVault
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: forest-vault
        persistentVolumeClaim:
          claimName: forest-vault-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - forest-core
              topologyKey: kubernetes.io/hostname

---
# Forest Core Service
apiVersion: v1
kind: Service
metadata:
  name: forest-core
  namespace: forest
  labels:
    app: forest-core
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: api
  selector:
    app: forest-core

---
# Forest Training - Code Generation
# Deployment: 1 replica (GPU workload), stateless
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forest-training
  namespace: forest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: forest-training
  template:
    metadata:
      labels:
        app: forest-training
    spec:
      containers:
      - name: forest-training
        image: forest-training:1.0.0-alpha
        ports:
        - containerPort: 8001
          name: api
        envFrom:
        - configMapRef:
            name: forest-config
        - secretRef:
            name: forest-secrets
        volumeMounts:
        - name: forest-vault
          mountPath: /home/forest/.ForestVault
        - name: model-cache
          mountPath: /cache
        resources:
          requests:
            memory: "1Gi"
            cpu: "1000m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        # GPU support (if available)
        # resources:
        #   requests:
        #     nvidia.com/gpu: 1
        #     memory: "2Gi"
        #     cpu: "1000m"
        #   limits:
        #     nvidia.com/gpu: 1
        #     memory: "2Gi"
        #     cpu: "2000m"
      volumes:
      - name: forest-vault
        persistentVolumeClaim:
          claimName: forest-vault-pvc
      - name: model-cache
        emptyDir:
          sizeLimit: 10Gi

---
# Forest Training Service
apiVersion: v1
kind: Service
metadata:
  name: forest-training
  namespace: forest
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    protocol: TCP
    name: api
  selector:
    app: forest-training

---
# Forest Audit - Logging
# StatefulSet: 1 replica with persistent volume
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forest-audit
  namespace: forest
spec:
  serviceName: forest-audit
  replicas: 1
  selector:
    matchLabels:
      app: forest-audit
  template:
    metadata:
      labels:
        app: forest-audit
    spec:
      containers:
      - name: forest-audit
        image: forest-audit:1.0.0-alpha
        ports:
        - containerPort: 8002
          name: api
        envFrom:
        - configMapRef:
            name: forest-config
        - secretRef:
            name: forest-secrets
        volumeMounts:
        - name: audit-logs
          mountPath: /app/audit_logs
        - name: forest-vault
          mountPath: /home/forest/.ForestVault
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: forest-vault
        persistentVolumeClaim:
          claimName: forest-vault-pvc
  volumeClaimTemplates:
  - metadata:
      name: audit-logs
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: standard
      resources:
        requests:
          storage: 10Gi

---
# Forest Audit Service
apiVersion: v1
kind: Service
metadata:
  name: forest-audit
  namespace: forest
spec:
  serviceName: forest-audit
  type: ClusterIP
  ports:
  - port: 8002
    targetPort: 8002
    protocol: TCP
    name: api
  selector:
    app: forest-audit

---
# Forest Dashboard - UI
# Deployment: 1 replica, stateless
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forest-dashboard
  namespace: forest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forest-dashboard
  template:
    metadata:
      labels:
        app: forest-dashboard
    spec:
      containers:
      - name: forest-dashboard
        image: forest-dashboard:1.0.0-alpha
        ports:
        - containerPort: 8501
          name: ui
        envFrom:
        - configMapRef:
            name: forest-config
        - secretRef:
            name: forest-secrets
        volumeMounts:
        - name: forest-vault
          mountPath: /home/forest/.ForestVault
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: forest-vault
        persistentVolumeClaim:
          claimName: forest-vault-pvc

---
# Forest Dashboard Service
apiVersion: v1
kind: Service
metadata:
  name: forest-dashboard
  namespace: forest
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 8501
    protocol: TCP
    name: ui
  selector:
    app: forest-dashboard
