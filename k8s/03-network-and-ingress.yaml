---
# Forest Network - Monitoring
# DaemonSet: runs on every node
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: forest-network
  namespace: forest
spec:
  selector:
    matchLabels:
      app: forest-network
  template:
    metadata:
      labels:
        app: forest-network
    spec:
      # Run on all nodes including control plane
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      
      containers:
      - name: forest-network
        image: forest-network:1.0.0-alpha
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: metrics
        envFrom:
        - configMapRef:
            name: forest-config
        - secretRef:
            name: forest-secrets
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: forest-vault
          mountPath: /home/forest/.ForestVault
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: proc
          mountPath: /proc
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        # Required for network operations
        securityContext:
          privileged: true
          capabilities:
            add:
            - NET_RAW
            - NET_ADMIN
            - SYS_ADMIN
        livenessProbe:
          exec:
            command:
            - python
            - -c
            - "from forest_network import NetworkScanner; print('OK')"
          initialDelaySeconds: 30
          periodSeconds: 60
      
      volumes:
      - name: forest-vault
        persistentVolumeClaim:
          claimName: forest-vault-pvc
      - name: sys
        hostPath:
          path: /sys
      - name: proc
        hostPath:
          path: /proc
      
      # Host networking for better network visibility
      hostNetwork: true
      hostPID: true

---
# Forest Network Service (metrics)
apiVersion: v1
kind: Service
metadata:
  name: forest-network
  namespace: forest
  labels:
    app: forest-network
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: forest-network
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
    name: metrics

---
# Ingress for external access
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: forest-ingress
  namespace: forest
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  tls:
  - hosts:
    - forest.example.com
    secretName: forest-tls
  rules:
  - host: forest.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: forest-dashboard
            port:
              number: 8501
      - path: /api/core
        pathType: Prefix
        backend:
          service:
            name: forest-core
            port:
              number: 8000
      - path: /api/training
        pathType: Prefix
        backend:
          service:
            name: forest-training
            port:
              number: 8001
      - path: /api/audit
        pathType: Prefix
        backend:
          service:
            name: forest-audit
            port:
              number: 8002

---
# NetworkPolicy for pod-to-pod communication
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forest-network-policy
  namespace: forest
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: forest
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: forest
  - to:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
