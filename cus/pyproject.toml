[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cus-swarm"
version = "0.8.3"
description = "Caste Unity System - Local Ollama red/blue jailbreak gauntlet with battery scoring and DPO data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0",
    "psutil>=5.9",
]

[project.scripts]
cus = "cus.cli.launcher:main"
