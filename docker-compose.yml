version: '3.8'

# Forest CUS — Docker Compose
#
# Starts two long-running services:
#   ollama      — local LLM inference on port 11434
#   dashboard   — Streamlit UI on port 8501
#
# The swarm runner (core/cus_langgraph.py) must be run locally because it
# needs access to the host's netstat, system logs, and process list.
#
# Usage:
#   docker-compose up -d            # start in background
#   docker-compose logs -f          # follow logs
#   docker-compose down             # stop

services:

  # ── Ollama — local LLM inference ──────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: forest-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ── Dashboard — Streamlit UI ───────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: forest-dashboard
    ports:
      - "8501:8501"
    environment:
      - FOREST_PATH=/app
      - OLLAMA_HOST=http://ollama:11434
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      # Mount the host's ForestVault so Docker dashboard reads live swarm data
      - type: bind
        source: ${HOME}/ForestVault
        target: /root/ForestVault
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  ollama_data:
